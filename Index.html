<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Issue Mashup</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #d1d5db;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --input-bg: #ffffff;
      --input-border: #9ca3af;
      --primary: #0066cc;
      --section-header-bg: #eef2f6;
      --section-header-text: #0f172a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121827;
        --card-bg: #1e293b;
        --border-color: #334155;
        --text-main: #f1f5f9;
        --text-muted: #cbd5e1;
        --input-bg: #0f172a;
        --input-border: #475569;
        --primary: #38ef7d;
        --section-header-bg: #334155;
        --section-header-text: #f8fafc;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.3;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 8px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--border-color);
    }

    .section { margin-bottom: 8px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      background-color: var(--section-header-bg);
      color: var(--section-header-text);
      padding: 3px 6px;
      border-radius: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .field-group { display: flex; flex-direction: column; }

    label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 4px 6px;
      font-size: 12px;
      font-family: inherit;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 36px; }

    .actions { display: flex; justify-content: flex-end; margin-top: 8px; }

    button {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>1) Software Issue Troubleshooting</h1>
  <form id="issueForm">
    <div class="section">
      <div class="section-title">Alarm Message</div>
      <div class="field-group">
        <label for="alarmMessage">Enter Alarm Message shown in software</label>
        <input type="text" id="alarmMessage" placeholder="e.g., ERR_302">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Recent Activities</div>
      <div class="grid-2">
        <div class="field-group">
          <label for="maintenance">Maintenance / service carried out?</label>
          <input type="text" id="maintenance" placeholder="Specify or 'No'">
        </div>
        <div class="field-group">
          <label for="hardwareExchanged">Hardware exchanged?</label>
          <input type="text" id="hardwareExchanged" placeholder="Specify or 'No'">
        </div>
        <div class="field-group">
          <label for="swVersion">New software version / config installed?</label>
          <input type="text" id="swVersion" placeholder="Specify or 'No'">
        </div>
        <div class="field-group">
          <label for="powerCycled">System power cycled (Before/after)?</label>
          <input type="text" id="powerCycled" placeholder="Specify details">
        </div>
      </div>
      <div class="field-group" style="margin-top: 6px;">
        <label for="lastEvatecAction">Last action by Evatec (retrofit, SW, HW, service)?</label>
        <input type="text" id="lastEvatecAction" placeholder="Specify details">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Recent Unexpected Events</div>
      <div class="grid-2">
        <div class="field-group">
          <label for="powerOutage">Power outage occurred?</label>
          <input type="text" id="powerOutage" placeholder="Details or 'No'">
        </div>
        <div class="grid-2" style="grid-column: span 2; display:grid;">
          <div class="field-group">
            <label for="priorAlarm">Prior alarm/failure & recovery method?</label>
            <input type="text" id="priorAlarm" placeholder="Details">
          </div>
        </div>
      </div>
      <div class="field-group" style="margin-top: 6px;">
        <label for="facilityProblem">Customer facility problem (water, gas, electricity, pumps)?</label>
        <input type="text" id="facilityProblem" placeholder="Specify or 'None'">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Error / Issue Occurrence</div>
      <div class="field-group">
        <label for="forceError">Describe what needs to be done to force the error</label>
        <textarea id="forceError" rows="2" placeholder="Reproduction steps..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="button" onclick="saveData()">Save Details</button>
    </div>
  </form>
</div>

<script>
  function saveData() {
    alert("Troubleshooting details recorded successfully.");
  }
</script>

</body>
</html>
